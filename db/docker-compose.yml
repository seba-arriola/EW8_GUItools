# PostgreSQL para información hipocentral de EW8_GUItools (dev).
#
# Las credenciales viven en ../run_working_v8/params/db.env
# (copiar de run_working_v8/params/db.env.example). Ese archivo trae las claves
# DB_* (conexión de los módulos) y POSTGRES_* (inicialización del contenedor).
#
#   docker compose -f db/docker-compose.yml up -d --wait   # arrancar
#   docker compose -f db/docker-compose.yml down            # detener
#   docker compose -f db/docker-compose.yml down -v         # reset (borra datos)
#
# El esquema se aplica SOLO al crear el volumen por primera vez
# (docker-entrypoint-initdb.d). Para reaplicarlo tras cambios: `down -v` + `up`.
#
# INSTANCIAS (worktrees): con COMPOSE_PROJECT_NAME=ew8_hypodb_<N>, DB_PORT=<puerto>
# y DB_RESTART=no (lo hace ew8_db.sh -i N) esta misma definicion levanta una base
# INDEPENDIENTE por instancia: contenedor propio, volumen propio (el nombre del
# volumen se prefija con el proyecto) y su puerto. Sin esas variables se comporta
# como la instancia 0 (`ew8_hypodb` en 5435).
name: ${COMPOSE_PROJECT_NAME:-ew8_hypodb}

services:
  db:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-ew8_hypodb}
    restart: ${DB_RESTART:-unless-stopped}
    env_file:
      - ../run_working_v8/params/db.env
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - ew8_db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ew8_db_data:
